[project]
name = "cyberwave-edge-core"
version = "0.1.6"
description = "The core component of the Cyberwave Edge Node"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "MIT"}
authors = [
    {name = "Cyberwave", email = "info@cyberwave.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "cyberwave>=0.4.4",
    # Engine HTTP API client. Required for byte-level docker pull progress
    # (the CLI suppresses byte deltas on a non-TTY pipe, so the subprocess
    # path can only ever surface coarse layer-count progress). driver_logs
    # falls back to the subprocess path on ImportError or daemon-unreachable
    # so a broken install doesn't break pulls — but absence of the SDK
    # silently degrades the progress UX.
    "docker>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.0.0",
]
# Optional ML runtime extras for the runtime-managed download fallback in
# ``model_manager._RUNTIME_SELF_DOWNLOADERS``. Without these, Edge Core
# can still resolve weights via backend-hosted artifacts, upstream
# ``download_url``, and operator-prestaged files — but catalog entries
# that rely on the runtime's own weight resolver (today: Ultralytics
# ``.pt`` checkpoints with no mirrored URL) will fail at download time
# with an actionable error.
#
# Versions and transitive deps are owned by the ``cyberwave`` SDK
# (``cyberwave-sdks/cyberwave-python/pyproject.toml`` → ``[tool.poetry.extras]``);
# these entries are thin passthroughs so edge-core never has to bump
# Ultralytics / Torch versions on its own.
ml         = ["cyberwave[ml]"]
ml-onnx    = ["cyberwave[ml-onnx]"]
ml-tflite  = ["cyberwave[ml-tflite]"]
ml-wakeword = ["cyberwave[ml-wakeword]"]
ml-stt     = ["cyberwave[ml-stt]"]
ml-stt-faster = ["cyberwave[ml-stt-faster]"]
ml-audio   = ["cyberwave[ml-audio]"]
microphone = ["cyberwave[microphone]"]
ml-all-vision = ["cyberwave[ml-all-vision]"]
ml-all-audio = ["cyberwave[ml-all-audio]"]
ml-all     = ["cyberwave[ml-all]"]
fuzzy-match = ["cyberwave[fuzzy-match]"]

[project.scripts]
cyberwave-edge-core = "cyberwave_edge_core.main:cli"

[project.urls]
Homepage = "https://cyberwave.com"
Documentation = "https://docs.cyberwave.com"
Repository = "https://github.com/cyberwave-os/cyberwave-edge-core"
Issues = "https://github.com/cyberwave-os/cyberwave-edge-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyberwave_edge_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
